name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bundle static enhancements
        shell: bash
        run: |
          cp lab-v2.js lab.js
          cat edge-v2.js >> lab.js
          cat multi-league.js >> lab.js
          if [ -f mobile.css ]; then cat mobile.css >> analytics.css; fi
          if [ -f compact-v2.css ]; then cat compact-v2.css >> analytics.css; fi
          if [ -f edge-v2.css ]; then cat edge-v2.css >> lab.css; fi
          if [ -f multi-league.css ]; then cat multi-league.css >> lab.css; fi

      - name: Validate bundle
        shell: bash
        run: |
          node --check lab.js
          ! grep -q "Playoff Odds + Scenario Tool" lab.js
          ! grep -q "SEASON LUCK WATCH" lab.js
          ! grep -q "ALL-PLAY RESULTS" lab.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
