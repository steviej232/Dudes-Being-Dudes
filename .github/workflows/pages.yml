name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bundle static enhancements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('edge.js')
          s = p.read_text()
          s = s.replace("opponent:null, window:null\n  };", "opponent:null, window:null, currentRows:[]\n  };")
          s = s.replace("function currentRow(rosterId){ const rows=state.matchups.get(Number(state.currentWeek)); return Array.isArray(rows)?rows.find(r=>Number(r.roster_id)===Number(rosterId)):null; }", "function currentRow(rosterId){ const rows=edge.currentRows||[]; return rows.find(r=>Number(r.roster_id)===Number(rosterId))||null; }")
          s = s.replace("if(!state.waiverPlayers?.length||force) await loadWaivers(force);\n      edge.lineup=await optimizeLineup();", "if(!state.waiverPlayers?.length||force) await loadWaivers(force);\n      edge.currentRows=await getMatchups(state.currentWeek);\n      edge.lineup=await optimizeLineup();")
          p.write_text(s)
          PY
          if [ -f mobile.css ]; then cat mobile.css >> analytics.css; fi
          if [ -f edge.css ]; then cat edge.css >> lab.css; fi
          if [ -f edge.js ]; then cat edge.js >> lab.js; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
