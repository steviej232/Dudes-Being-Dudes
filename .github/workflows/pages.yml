name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Sleeper-only site
        shell: bash
        run: |
          node --check app.js
          node --check lab.js
          node --check edge.js
          node --check experience.js
          test ! -e connect.html
          test ! -e connect.js
          test ! -e multi-league.js
          test ! -e data/private-leagues.json
          ! grep -q "multi-league\|connect.html\|private-leagues" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
