name: Sync private fantasy leagues

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_private_leagues.py'
      - '.github/workflows/sync-private-leagues.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync ESPN and Yahoo data
        env:
          FANTASY_SEASON: '2026'
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          YAHOO_ACCESS_TOKEN: ${{ secrets.YAHOO_ACCESS_TOKEN }}
        run: python scripts/sync_private_leagues.py

      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- data/private-leagues.json; then
            echo 'No league-data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/private-leagues.json
          git commit -m 'Refresh private fantasy league cache'
          git push
