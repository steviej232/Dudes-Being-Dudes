<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Connect Fantasy League · Dudes Being Dudes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#111827;--muted:#697386;--line:#e6e0d6;--paper:#fffdf8;--blue:#2563eb;--green:#16794a;--red:#b42318}
    *{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:var(--ink);font-family:'DM Sans',sans-serif}.wrap{width:min(720px,calc(100% - 28px));margin:0 auto;padding:32px 0 60px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.05)}.kicker{font:800 .68rem Manrope;letter-spacing:.1em;color:var(--muted)}h1{font:800 1.7rem Manrope;margin:8px 0 6px}.muted{color:var(--muted);line-height:1.5}.steps{display:grid;gap:10px;margin:20px 0}.step{border:1px solid var(--line);border-radius:16px;padding:14px}.step strong,.step span{display:block}.step span{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.4}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:46px;border-radius:14px;border:0;padding:0 16px;font:800 .82rem Manrope;cursor:pointer;text-decoration:none}.primary{background:var(--ink);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{margin-top:16px;padding:13px;border-radius:14px;background:#eef4ff;color:#24446d;font-size:.8rem;line-height:1.45}.status.good{background:#eaf7ef;color:var(--green)}.status.bad{background:#fff0ee;color:var(--red)}label{display:block;font-weight:700;font-size:.8rem;margin-top:16px}input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:white}.tiny{font-size:.7rem;color:var(--muted);margin-top:12px;line-height:1.45}@media(max-width:600px){.wrap{padding-top:18px}.card{padding:18px;border-radius:20px}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <span class="kicker">PRIVATE CONNECTION</span>
    <h1 id="title">Connect fantasy league</h1>
    <p class="muted" id="intro">Preparing the provider login flow…</p>
    <div id="content"></div>
    <div id="status" class="status">Ready.</div>
    <p class="tiny">Provider passwords are never collected by this page. Yahoo OAuth tokens, when available, stay in this browser. ESPN is tested using your existing ESPN browser session.</p>
  </section></main>
  <script src="connect.js"></script>
</body>
</html>
